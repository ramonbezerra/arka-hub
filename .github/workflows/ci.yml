name: Deploy production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "test-only-secret"
        run: pytest -q

  frontend-ci:
    name: Frontend CI and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: yarn install

      - name: Build
        env:
          VITE_API_URL: ${{ vars.EB_API_URL }}
        run: yarn run build

      - name: Store production build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/build
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    name: Deploy existing AWS resources
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assume AWS role with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Publish hashed frontend assets
        run: |
          aws s3 sync frontend/dist/ "s3://${{ vars.S3_BUCKET }}/" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Publish HTML without long cache
        run: |
          aws s3 cp frontend/dist/index.html \
            "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html"

      - name: Build Elastic Beanstalk bundle
        run: |
          cd backend

          zip -r ../api-arka-hub-${{ github.sha }}.zip . \
            -x ".env" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x ".venv/*" \
            -x "venv/*" \
            -x ".pytest_cache/*" \
            -x ".git/*"
     
      - name: Verify bundle
        run: |
          unzip -p api-arka-hub-${{ github.sha }}.zip Procfile
          echo
          unzip -l api-arka-hub-${{ github.sha }}.zip | grep -E 'Procfile|app.py|requirements.txt'
      
      - name: Deploy source bundle to existing EB environment
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1
        with:
          application-name: ${{ vars.EB_APPLICATION_NAME }}
          environment-name: ${{ vars.EB_ENVIRONMENT_NAME }}
          version-label: api-${{ github.sha }}
          aws-region: ${{ vars.AWS_REGION }}
          deployment-package-path: api-arka-hub-${{ github.sha }}.zip
          wait-for-deployment: true

      - name: Smoke test API
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              "${{ vars.EB_API_URL }}/api/health"; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Smoke test frontend
        run: |
          curl --fail --silent --show-error \
            "${{ vars.FRONTEND_URL }}/" > /dev/null

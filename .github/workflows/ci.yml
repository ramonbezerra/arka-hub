name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test:ci

      - name: Build
        run: yarn build

  docker:
    name: Docker build + compose config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: arka-hub-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: arka-hub-frontend:ci

      - name: Validate docker-compose
        run: docker compose config --quiet

  integration:
    name: Compose stack + health endpoints
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - uses: actions/checkout@v4

      - name: Start compose stack
        run: docker compose up -d --wait --wait-timeout 120

      - name: Assert /api/health returns 200
        run: |
          code=$(curl --silent --show-error --output /tmp/health.json \
            --write-out '%{http_code}' http://localhost:5000/api/health)
          echo "GET /api/health -> $code"
          cat /tmp/health.json
          test "$code" = '200'

      - name: Assert /api/health/ready returns 200
        run: |
          code=$(curl --silent --show-error --output /tmp/ready.json \
            --write-out '%{http_code}' http://localhost:5000/api/health/ready)
          echo "GET /api/health/ready -> $code"
          cat /tmp/ready.json
          test "$code" = '200'

      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down compose stack
        if: always()
        run: docker compose down -v
